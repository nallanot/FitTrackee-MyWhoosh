# Standalone production deployment for FitTrackee with native MyWhoosh support.
#
# No physical .env file is required. Define APP_SECRET_KEY and
# POSTGRES_PASSWORD in your stack/deployment environment. All other variables
# below have usable defaults and may be overridden from the same interface.

x-fittrackee-environment: &fittrackee-environment
  FLASK_APP: fittrackee
  FLASK_SKIP_DOTENV: "1"
  APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY must be defined}
  APP_LOG: /usr/src/app/logs/fittrackee.log
  UPLOAD_FOLDER: /usr/src/app/uploads
  STATICMAP_CACHE_DIR: /usr/src/app/.staticmap_cache
  UI_URL: ${UI_URL:-}
  DATABASE_URL: postgresql://${POSTGRES_USER:-fittrackee}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be defined}@fittrackee-db:5432/${POSTGRES_DB:-fittrackee}
  MYWHOOSH_SYNC_INTERVAL: ${MYWHOOSH_SYNC_INTERVAL:-600}

services:
  fittrackee-db:
    image: postgis/postgis:18-3.6-alpine
    container_name: fittrackee-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fittrackee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be defined}
      POSTGRES_DB: ${POSTGRES_DB:-fittrackee}
    volumes:
      - ${HOST_DATABASE_DIR:-./data/db}:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 15s
      retries: 10
    networks:
      - internal_network
    restart: unless-stopped

  fittrackee:
    image: fittrackee-mywhoosh:local
    build:
      context: .
    container_name: fittrackee
    environment: *fittrackee-environment
    volumes:
      - ${HOST_UPLOAD_DIR:-./data/uploads}:/usr/src/app/uploads
      - ${HOST_STATICMAP_CACHE_DIR:-./data/staticmap_cache}:/usr/src/app/.staticmap_cache
      - ${HOST_LOG_DIR:-./data/logs}:/usr/src/app/logs
    post_start:
      - command: chown -R fittrackee:fittrackee /usr/src/app/uploads /usr/src/app/.staticmap_cache /usr/src/app/logs
        user: root
    ports:
      - "${HOST_APP_PORT:-5000}:5000"
    command: sh docker-entrypoint.sh
    depends_on:
      fittrackee-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget --spider http://127.0.0.1:5000/api/check-db || exit 1
      interval: 5s
      timeout: 15s
      retries: 10
    networks:
      - external_network
      - internal_network
    restart: unless-stopped

  fittrackee-mywhoosh-scheduler:
    image: fittrackee-mywhoosh:local
    build:
      context: .
    container_name: fittrackee-mywhoosh-scheduler
    environment: *fittrackee-environment
    volumes:
      - ${HOST_UPLOAD_DIR:-./data/uploads}:/usr/src/app/uploads
      - ${HOST_STATICMAP_CACHE_DIR:-./data/staticmap_cache}:/usr/src/app/.staticmap_cache
      - ${HOST_LOG_DIR:-./data/logs}:/usr/src/app/logs
    command: >-
      sh -c 'while true; do
      ftcli integrations mywhoosh-sync || true;
      sleep "$${MYWHOOSH_SYNC_INTERVAL}";
      done'
    depends_on:
      fittrackee:
        condition: service_healthy
    networks:
      - external_network
      - internal_network
    restart: unless-stopped

networks:
  external_network:
    # Reuse the existing Traefik network instead of consuming another Docker
    # automatic address pool. Override TRAEFIK_NETWORK if it has another name.
    name: ${TRAEFIK_NETWORK:-traefik_default}
    external: true
  internal_network:
    internal: true
    # This host has exhausted Docker's predefined address pools. Keep the
    # private database network deliberately small and outside existing ranges.
    ipam:
      config:
        - subnet: ${FITTRACKEE_INTERNAL_SUBNET:-10.254.254.0/29}
